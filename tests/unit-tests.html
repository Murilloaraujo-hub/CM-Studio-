    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1c2228; background: #f4f5f2; }
    h1 { font-size: 1.5rem; }
    #summary { font-weight: 700; padding: .75rem 1rem; border-radius: 8px; display: inline-block; margin: 1rem 0; }
    #summary.ok { background: #e4f3ea; color: #1d7448; }
    #summary.fail { background: #fdecea; color: #b42318; }
    ul { list-style: none; padding: 0; }
    li { padding: .4rem 0; border-bottom: 1px solid #e0e3dd; }
    li.ok { color: #1d7448; }
    li.fail { color: #b42318; font-weight: 600; }
    p { max-width: 70ch; }
  </style>
</head>
<body>
  <h1>CM Studio — Testes unitários</h1>
  <p>Estes testes rodam no próprio navegador e não precisam de instalação. Os dados salvos do CM Studio são preservados e restaurados ao final.</p>
